name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A cancelled merge-queue check reads as a failure and ejects the pull
  # request from the queue, so those runs always finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' &&
    !startsWith(github.ref, 'refs/tags/v') &&
    github.event_name != 'merge_group' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --all-targets

  build:
    name: Build
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - name: Smoke test the diagnostics
        # The tray app itself needs a desktop session, so only the diagnostics run here.
        run: |
          .\target\release\tray-monitor.exe --help
          .\target\release\tray-monitor.exe --interfaces
          .\target\release\tray-monitor.exe --theme
          .\target\release\tray-monitor.exe --dump
      - name: Check the rendered icons
        # 이름을 나열하지 않는다. 지표를 늘리면 dump 파일 이름도 바뀌므로
        # 개수와 내용만 확인한다.
        run: |
          $files = @(Get-ChildItem out -Filter *.bmp)
          Write-Output "dumped $($files.Count) files"
          if ($files.Count -lt 6) { throw "expected at least six dumped files, found $($files.Count)" }
          foreach ($file in $files) {
            if ($file.Length -le 0) { throw "empty $($file.Name)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: tray-monitor-windows-x64
          path: target/release/tray-monitor.exe

  package:
    name: Package
    needs: build
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: tray-monitor-windows-x64
          path: artifact
      - name: Check the committed assets
        run: python tools/make_assets.py --check
      - name: Check the generated glyph table
        run: python tools/pixelfont.py --check
      - name: Build the installer
        shell: pwsh
        run: pwsh -NoProfile -File ./packaging/windows/build-installer.ps1 -Exe artifact/tray-monitor.exe -OutputDir dist
      - name: Build the MSIX
        shell: pwsh
        run: pwsh -NoProfile -File ./packaging/windows/build-msix.ps1 -Exe artifact/tray-monitor.exe -OutputDir dist
      - name: Smoke test the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'tray-monitor-install'
          Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue

          $setup = Get-ChildItem dist -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'installer not found' }
          $install = Start-Process -FilePath $setup.FullName `
            -ArgumentList '/VERYSILENT', '/CURRENTUSER', "/DIR=$dir", '/NORESTART' `
            -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "installer exited with $($install.ExitCode)" }

          $exe = Join-Path $dir 'tray-monitor.exe'
          if (-not (Test-Path $exe)) { throw 'installed executable missing' }
          # GUI subsystem exe does not set $LASTEXITCODE. Start-Process waits and
          # gives the real exit code.
          $run = Start-Process -FilePath $exe -ArgumentList '--help' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "installed executable exited with $($run.ExitCode)" }

          $uninstall = Start-Process -FilePath (Join-Path $dir 'unins000.exe') `
            -ArgumentList '/VERYSILENT' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "uninstaller exited with $($uninstall.ExitCode)" }
          if (Test-Path $exe) { throw 'uninstaller left the executable behind' }
      - uses: actions/upload-artifact@v4
        with:
          name: tray-monitor-packages
          path: |
            dist/*.exe
            dist/*.msix
          if-no-files-found: error

  quality-gate:
    name: Quality Gate
    # The single required check for `main`. Branch protection and the merge
    # queue both gate on this job, so it has to report on every pull request
    # and every merge-queue run, including when a job it needs fails.
    if: always() && (github.event_name == 'pull_request' ||
      github.event_name == 'merge_group')
    needs:
      - format
      - clippy
      - test
      - build
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality job to succeed
        env:
          QUALITY_RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$QUALITY_RESULTS"

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - format
      - clippy
      - test
      - package
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: tray-monitor-windows-x64
          path: artifact
      - uses: actions/download-artifact@v4
        with:
          name: tray-monitor-packages
          path: dist
      - name: Check the tag against the binary
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $built = (Get-Item artifact/tray-monitor.exe).VersionInfo.ProductVersion
          if ($version -ne $built) {
            throw "tag v$version does not match the binary ($built)"
          }
      - name: Package the archive
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $name = "tray-monitor-$version-windows-x64"
          $stage = "dist/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path artifact/tray-monitor.exe -Destination $stage
          Copy-Item -Path README.md, LICENSE -Destination $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$name.zip"
      - name: Write checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File |
            Where-Object { $_.Extension -in '.zip', '.exe', '.msix' } |
            Sort-Object Name
          if ($files.Count -ne 3) {
            throw "expected three artifacts, found $($files.Count)"
          }
          $lines = $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          # LF로만 쓴다. CRLF로 쓰면 Linux/macOS의 sha256sum이 CR을 파일 이름의 일부로 보고
          # `FAILED open or read`로 떨어진다(실측: v0.3.0 배포본).
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS", ($lines -join "`n") + "`n")
          Get-Content dist/SHA256SUMS
      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 네이티브 명령은 PowerShell이 와일드카드를 펼쳐 주지 않으므로 경로를 직접 만든다.
          $assets = @(Get-ChildItem dist -File |
            Where-Object { $_.Extension -in '.zip', '.exe', '.msix' } |
            Select-Object -ExpandProperty FullName)
          $assets += (Resolve-Path dist/SHA256SUMS).Path
          gh release create $env:GITHUB_REF_NAME @assets --generate-notes
