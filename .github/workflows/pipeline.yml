name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A cancelled merge-queue check reads as a failure and ejects the pull
  # request from the queue, so those runs always finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' &&
    !startsWith(github.ref, 'refs/tags/v') &&
    github.event_name != 'merge_group' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  format:
    name: Format
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --all-targets

  build:
    name: Build
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - name: Smoke test the diagnostics
        # The tray app itself needs a desktop session, so only the diagnostics run here.
        run: |
          .\target\release\tray-monitor.exe --help
          .\target\release\tray-monitor.exe --interfaces
          .\target\release\tray-monitor.exe --dump
      - name: Check the rendered icons
        # 이름을 나열하지 않는다. 지표를 늘리면 dump 파일 이름도 바뀌므로
        # 개수와 내용만 확인한다.
        run: |
          $files = @(Get-ChildItem out -Filter *.bmp)
          Write-Output "dumped $($files.Count) files"
          if ($files.Count -lt 6) { throw "expected at least six dumped files, found $($files.Count)" }
          foreach ($file in $files) {
            if ($file.Length -le 0) { throw "empty $($file.Name)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: tray-monitor-windows-x64
          path: target/release/tray-monitor.exe

  quality-gate:
    name: Quality Gate
    # The single required check for `main`. Branch protection and the merge
    # queue both gate on this job, so it has to report on every pull request
    # and every merge-queue run, including when a job it needs fails.
    if: always() && (github.event_name == 'pull_request' ||
      github.event_name == 'merge_group')
    needs:
      - format
      - clippy
      - test
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality job to succeed
        env:
          QUALITY_RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$QUALITY_RESULTS"

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - format
      - clippy
      - test
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - name: Package the archive
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $name = "tray-monitor-$version-windows-x64"
          $stage = "dist/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path target/release/tray-monitor.exe -Destination $stage
          Copy-Item -Path README.md, LICENSE -Destination $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$name.zip"
      - name: Write checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS -Encoding utf8
          Get-Content dist/SHA256SUMS
      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 네이티브 명령은 PowerShell이 와일드카드를 펼쳐 주지 않으므로 경로를 직접 만든다.
          $assets = @(Get-ChildItem dist -Filter *.zip | Select-Object -ExpandProperty FullName)
          $assets += (Resolve-Path dist/SHA256SUMS).Path
          gh release create $env:GITHUB_REF_NAME @assets --generate-notes
