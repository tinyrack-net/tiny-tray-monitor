name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A cancelled merge-queue check reads as a failure and ejects the pull
  # request from the queue, so those runs always finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' &&
    !startsWith(github.ref, 'refs/tags/v') &&
    github.event_name != 'merge_group' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --all-targets

  build:
    name: Build
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - name: Smoke test the diagnostics
        # The tray app itself needs a desktop session, so only the diagnostics run here.
        run: |
          .\target\release\tiny-tray-monitor.exe --help
          .\target\release\tiny-tray-monitor.exe --interfaces
          .\target\release\tiny-tray-monitor.exe --theme
          .\target\release\tiny-tray-monitor.exe --dump
      - name: Check the rendered icons
        # 이름을 나열하지 않는다. 지표를 늘리면 dump 파일 이름도 바뀌므로
        # 개수와 내용만 확인한다.
        run: |
          $files = @(Get-ChildItem out -Filter *.bmp)
          Write-Output "dumped $($files.Count) files"
          if ($files.Count -lt 6) { throw "expected at least six dumped files, found $($files.Count)" }
          foreach ($file in $files) {
            if ($file.Length -le 0) { throw "empty $($file.Name)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: tiny-tray-monitor-windows-x64
          path: target/release/tiny-tray-monitor.exe

  package:
    name: Package
    needs: build
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: tiny-tray-monitor-windows-x64
          path: artifact
      - name: Check the committed assets
        run: python tools/make_assets.py --check
      - name: Check the generated glyph table
        run: python tools/pixelfont.py --check
      - name: Build the installer
        shell: pwsh
        run: pwsh -NoProfile -File ./packaging/windows/build-installer.ps1 -Exe artifact/tiny-tray-monitor.exe -OutputDir dist
      - name: Build the MSIX
        shell: pwsh
        run: pwsh -NoProfile -File ./packaging/windows/build-msix.ps1 -Exe artifact/tiny-tray-monitor.exe -OutputDir dist
      - name: Smoke test the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'tiny-tray-monitor-install'
          Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue

          $setup = Get-ChildItem dist -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'installer not found' }
          $install = Start-Process -FilePath $setup.FullName `
            -ArgumentList '/VERYSILENT', '/CURRENTUSER', "/DIR=$dir", '/NORESTART' `
            -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "installer exited with $($install.ExitCode)" }

          $exe = Join-Path $dir 'tiny-tray-monitor.exe'
          if (-not (Test-Path $exe)) { throw 'installed executable missing' }
          # GUI subsystem exe does not set $LASTEXITCODE. Start-Process waits and
          # gives the real exit code.
          $run = Start-Process -FilePath $exe -ArgumentList '--help' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "installed executable exited with $($run.ExitCode)" }

          $uninstall = Start-Process -FilePath (Join-Path $dir 'unins000.exe') `
            -ArgumentList '/VERYSILENT' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "uninstaller exited with $($uninstall.ExitCode)" }
          # Inno Setup's uninstaller re-launches a temporary copy of itself, so the
          # files can still be there when unins000.exe returns (v0.13.0 tag run).
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path $exe) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $exe) { throw 'uninstaller left the executable behind' }
      - uses: actions/upload-artifact@v4
        with:
          name: tiny-tray-monitor-packages
          path: |
            dist/*.exe
            dist/*.msix
          if-no-files-found: error

  quality-gate:
    name: Quality Gate
    # The single required check for `main`. Branch protection and the merge
    # queue both gate on this job, so it has to report on every pull request
    # and every merge-queue run, including when a job it needs fails.
    if: always() && (github.event_name == 'pull_request' ||
      github.event_name == 'merge_group')
    needs:
      - format
      - clippy
      - test
      - build
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality job to succeed
        env:
          QUALITY_RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$QUALITY_RESULTS"

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - format
      - clippy
      - test
      - package
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: tiny-tray-monitor-windows-x64
          path: artifact
      - uses: actions/download-artifact@v4
        with:
          name: tiny-tray-monitor-packages
          path: dist
      - name: Check the tag against the binary
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $built = (Get-Item artifact/tiny-tray-monitor.exe).VersionInfo.ProductVersion
          if ($version -ne $built) {
            throw "tag v$version does not match the binary ($built)"
          }
      - name: Package the archive
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $name = "tiny-tray-monitor-$version-windows-x64"
          $stage = "dist/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path artifact/tiny-tray-monitor.exe -Destination $stage
          Copy-Item -Path README.md, LICENSE -Destination $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$name.zip"
      - name: Write checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File |
            Where-Object { $_.Extension -in '.zip', '.exe', '.msix' } |
            Sort-Object Name
          if ($files.Count -ne 3) {
            throw "expected three artifacts, found $($files.Count)"
          }
          $lines = $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          # LF로만 쓴다. CRLF로 쓰면 Linux/macOS의 sha256sum이 CR을 파일 이름의 일부로 보고
          # `FAILED open or read`로 떨어진다(실측: v0.3.0 배포본).
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS", ($lines -join "`n") + "`n")
          Get-Content dist/SHA256SUMS
      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 네이티브 명령은 PowerShell이 와일드카드를 펼쳐 주지 않으므로 경로를 직접 만든다.
          $assets = @(Get-ChildItem dist -File |
            Where-Object { $_.Extension -in '.zip', '.exe', '.msix' } |
            Select-Object -ExpandProperty FullName)
          $assets += (Resolve-Path dist/SHA256SUMS).Path
          gh release create $env:GITHUB_REF_NAME @assets --generate-notes

  store-draft:
    name: Store draft
    # 태그 릴리스에서 MSIX를 Store 제출 "초안"으로 올리고 거기서 멈춘다.
    # 이 제품은 가격을 시장별로 관리해서 제출 API가 기본 가격을 되돌려주지 못한다.
    # --priceId 로 기본가를 명시하면 가격 모델이 고급에서 단일 기본가로 바뀌고,
    # 주지 않으면 CLI가 스스로 멈춘다(둘 다 실측). 그래서 CI는 초안까지이고
    # 커밋은 사람이 Partner Center에서 가격을 확인한 뒤 한다.
    # 근거: docs/RELEASE-AUTOMATION.md §8-6
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - release
    runs-on: windows-2025
    timeout-minutes: 30
    environment: store
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: tiny-tray-monitor-packages
          path: dist
      - uses: microsoft/microsoft-store-apppublisher@v1.1
      - name: Reconfigure the Store CLI
        shell: pwsh
        env:
          STORE_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          STORE_SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          # 자격증명은 커맨드라인에 남지 않도록 환경변수로 받는다.
          msstore reconfigure `
            --tenantId $env:STORE_TENANT_ID `
            --sellerId $env:STORE_SELLER_ID `
            --clientId $env:STORE_CLIENT_ID `
            --clientSecret $env:STORE_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed with $LASTEXITCODE" }
      - name: Refuse to run with a pending submission
        shell: pwsh
        # 제출은 동시에 하나만 유효하다. 진행 중인 초안이 있으면 덮지 않고 멈춘다.
        env:
          STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
        run: |
          $json = msstore submission get $env:STORE_PRODUCT_ID 2>$null | ConvertFrom-Json
          if ($json.Status -ne 'Published') {
            # 앞선 실행이 제출 생성 도중 실패하면 초안이 남는다. 그때는 Store 워크플로의
            # action=delete 로 지운 뒤 다시 돌린다(자동 삭제는 하지 않는다).
            throw "a submission is already pending (Status: $($json.Status)); delete it with the Store workflow and re-run"
          }
      - name: Upload the package as a draft
        shell: pwsh
        env:
          STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
          STORE_PRICE_TIER: ${{ vars.STORE_PRICE_TIER }}
        run: |
          $msix = (Get-ChildItem dist -Filter '*.msix' | Select-Object -First 1).FullName
          $arguments = @($msix, '-id', $env:STORE_PRODUCT_ID, '--noCommit')
          if ($env:STORE_PRICE_TIER) {
            # 시장별 가격이 보존된다는 보장이 없으므로 기본가를 명시하고 커밋하지 않는다.
            $arguments += @('--priceId', $env:STORE_PRICE_TIER)
          }
          msstore publish @arguments
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed with $LASTEXITCODE" }
      - name: Verify the draft
        shell: pwsh
        env:
          STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          $json = msstore submission get $env:STORE_PRODUCT_ID 2>$null | ConvertFrom-Json
          if ($json.Status -ne 'PendingCommit') {
            throw "expected a pending draft, got $($json.Status)"
          }
          # 방금 올린 패키지는 FileName 으로만 보인다(Version 은 커밋 뒤에 채워진다).
          # 이전 패키지가 Version 을 달고 남아 있으므로 태그 버전으로 찾는다.
          $version = $env:TAG_VERSION.TrimStart('v')
          $names = @($json.ApplicationPackages | ForEach-Object { $_.FileName })
          if (-not ($names | Where-Object { $_ -like "*$version*" })) {
            throw "the draft carries no $version package (has: $($names -join ', '))"
          }
          $names | ForEach-Object { Write-Output "package: $_" }
          Write-Output "priceId: $($json.Pricing.PriceId)"
          Write-Output "advancedPricing: $($json.Pricing.IsAdvancedPricingModel)"
      - name: Explain the next step
        shell: pwsh
        # 제출 API는 시장별 가격을 읽지도 쓰지도 못한다(SalesUnsupportedWarning).
        # 그래서 가격 확인은 CI가 대신할 수 없고 사람이 해야 한다.
        run: |
          @'
          ## The Store submission is a draft

          Nothing is live yet. Before committing:

          1. Open Partner Center -> TinyTrayMonitor -> the pending submission.
          2. Check **Pricing and availability**. The submission API cannot read or
             write per-market prices, so CI cannot verify them for you.
          3. Check that the package version and the listing are the ones you expect.

          Then run the **Store** workflow with `action=commit`,
          or submit the draft from Partner Center.
          '@ | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
