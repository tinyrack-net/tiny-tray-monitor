[package]
name = "tiny-tray-monitor"
version = "0.10.1"
edition = "2024"
rust-version = "1.85"
description = "CPU, memory, network, GPU and disk readouts in the Windows system tray"
license = "MIT"
repository = "https://github.com/tinyrack-net/tiny-tray-monitor"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
tray-icon = "0.26"
windows-future = "0.3"
windows-registry = "0.100"

[build-dependencies]
# resources/app.rc 를 컴파일해 VERSIONINFO 와 매니페스트를 exe 에 링크한다.
embed-resource = "3"

[dependencies.windows]
version = "0.62"
features = [
    "ApplicationModel",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true

# CI는 RUSTFLAGS로 경고를 막지 않는다. RUSTFLAGS는 .cargo/config.toml의
# rustflags(정적 CRT)를 덮어쓰기 때문이다.
[lints.rust]
warnings = "deny"
